<html>
<head>
  <meta charset="UTF-8">

  <meta name="viewport"

                 height=device-height,
                 initial-scale=1.0,
                 maximum-scale=1.0,<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 height=device-height,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
    }

    a-scene {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
    }

    #message {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 18px;
      z-index: 999;
      display: none;
    }
  </style>
</head>

<body>

<div id="message">获得成功！</div>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
  embedded
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <!-- 手机点击检测 -->
  <a-camera
    position="0 0 0"
    look-controls="enabled: false"
    cursor="rayOrigin: mouse; fuse: false"
    raycaster="objects: .clickable">
  </a-camera>

  <!-- 图片识别目标 -->
  <a-entity mindar-image-target="targetIndex: 0">

    <!-- 测试物体 -->
    <a-box
      id="targetObject"
      class="clickable"
      position="0 0 0.3"
      width="0.6"
      height="0.6"
      depth="0.6"
      color="#8B4513">
    </a-box>

  </a-entity>

</a-scene>

<script>

const object = document.querySelector("#targetObject");
const message = document.querySelector("#message");

let holdTimer = null;
let holding = false;


// 开始按住
function startHold() {

  if (holding) return;

  holding = true;

  console.log("开始长按");

  holdTimer = setTimeout(function () {

    console.log("长按1秒成功");

    // 物体消失
    object.setAttribute("visible", false);

    // 提示
    message.style.display = "block";

    setTimeout(function () {
      message.style.display = "none";
    }, 2000);

    holding = false;

  }, 1000);
}


// 松开 / 中断
function cancelHold() {

  if (holdTimer) {

    clearTimeout(holdTimer);

    holdTimer = null;

  }

  holding = false;

  console.log("取消长按");
}


// 手机
object.addEventListener("touchstart", startHold);
object.addEventListener("touchend", cancelHold);
object.addEventListener("touchcancel", cancelHold);


// A-Frame 光线点击
object.addEventListener("mousedown", startHold);
object.addEventListener("mouseup", cancelHold);
object.addEventListener("mouseleave", cancelHold);

</script>

</body>
</html>

  <style>

    }

    a-scene {
      position: fixed !important;

      left: 0 !important;
      width: 100vw !important;

    }

    #message {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 18px;
      z-index: 999;
      display: none;
    }
  </style>
</head>

<body>

<div id="message">宝箱打开！获得奖品！</div>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
  embedded
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-camera
    position="0 0 0"
    look-controls="enabled: false"
    cursor="rayOrigin: mouse"
    raycaster="objects: .clickable">
  </a-camera>

  <a-entity mindar-image-target="targetIndex: 0">

    <!-- 关闭状态的宝箱 -->
    <a-entity id="closedChest" class="clickable">

      <!-- 宝箱主体 -->
      <a-box
        position="0 0 0.15"
        width="0.8"
        height="0.4"
        depth="0.5"
        color="#8B4513">
      </a-box>

      <!-- 宝箱盖 -->
      <a-box
        position="0 0 0.4"
        width="0.8"
        height="0.15"
        depth="0.5"
        color="#A0522D">
      </a-box>

    </a-entity>


    <!-- 打开状态 -->
    <a-entity id="openChest" visible="false">

      <!-- 宝箱主体 -->
      <a-box
        position="0 0 0.15"
        width="0.8"
        height="0.4"
        depth="0.5"
        color="#8B4513">
      </a-box>

      <!-- 打开的盖子 -->
      <a-box
        position="0 0.18 0.5"
        rotation="-60 0 0"
        width="0.8"
        height="0.15"
        depth="0.5"
        color="#A0522D">
      </a-box>

    </a-entity>


    <!-- 奖品 -->
    <a-sphere
      id="prize"
      visible="false"
      position="0 0 0.9"
      radius="0.18"
      color="gold"
      animation="property: position;
                 from: 0 0 0.5;
                 to: 0 0 1;
                 dur: 1000;
                 loop: true;
                 dir: alternate;">
    </a-sphere>

  </a-entity>

</a-scene>


<script>

  document.addEventListener("DOMContentLoaded", function () {

    const closedChest =
      document.querySelector("#closedChest");

    const openChest =
      document.querySelector("#openChest");

    const prize =
      document.querySelector("#prize");

    const message =
      document.querySelector("#message");


    closedChest.addEventListener("click", function () {

      console.log("宝箱被点击");

      closedChest.setAttribute("visible", false);

      openChest.setAttribute("visible", true);

      prize.setAttribute("visible", true);

      message.style.display = "block";


      setTimeout(function () {

        message.style.display = "none";

      }, 3000);

    });

  });

</script>

</body>
</html>
