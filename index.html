<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
  >

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    a-scene {
      position: fixed !important;
      top: 0;
      left: 0;
      width: 100vw !important;
      height: 100vh !important;
    }

    #ui {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 40px;
      z-index: 9999;

      display: flex;
      flex-direction: column;
      align-items: center;

      pointer-events: none;
    }

    #stampCount {
      margin-bottom: 10px;
      padding: 8px 14px;

      background: rgba(255, 255, 255, 0.9);
      color: #222;

      border-radius: 10px;

      font-family: Arial, sans-serif;
      font-size: 15px;
      font-weight: bold;
    }

    #status {
      margin-bottom: 15px;
      padding: 10px 16px;

      background: rgba(0, 0, 0, 0.7);
      color: white;

      border-radius: 10px;

      font-family: Arial, sans-serif;
      font-size: 16px;
      text-align: center;
    }

    #holdButton {
      position: relative;

      width: 220px;
      height: 58px;

      border: none;
      border-radius: 14px;

      background: rgba(20, 20, 20, 0.9);
      color: white;

      font-size: 16px;
      font-weight: bold;

      overflow: hidden;

      display: none;

      pointer-events: auto;

      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    #progress {
      position: absolute;
      top: 0;
      left: 0;

      width: 0%;
      height: 100%;

      background: rgba(255, 255, 255, 0.25);

      transition: none;

      pointer-events: none;
    }

    #buttonText {
      position: relative;
      z-index: 2;
    }

    #stampMessage {
      position: fixed;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      z-index: 10000;

      padding: 20px 30px;

      background: rgba(0, 0, 0, 0.85);
      color: white;

      border-radius: 16px;

      font-family: Arial, sans-serif;

      font-size: 28px;
      font-weight: bold;

      text-align: center;

      display: none;

      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="ui">

    <div id="stampCount">
      STAMPS: 0 / 4
    </div>

    <div id="status">
      Point the camera at the target
    </div>

    <button id="holdButton" type="button">

      <div id="progress"></div>

      <span id="buttonText">
        HOLD TO OPEN
      </span>

    </button>

  </div>


  <div id="stampMessage">
    STAMP GET!
  </div>


  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      filterMinCF: 0.0005;
      filterBeta: 300;
      warmupTolerance: 10;
      missTolerance: 10;
    "

    embedded

    color-space="sRGB"

    renderer="
      colorManagement: true;
      antialias: false;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"
  >

    <a-assets>

      <a-asset-item
        id="closedChestModel"
        src="https://cdn.3dassets.dev/assets/19941/v1/model.glb"
        crossorigin="anonymous">
      </a-asset-item>

      <a-asset-item
        id="openChestModel"
        src="https://cdn.3dassets.dev/assets/19950/v1/model.glb"
        crossorigin="anonymous">
      </a-asset-item>

    </a-assets>


    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>


    <a-entity
      id="imageTarget"
      mindar-image-target="targetIndex: 0"
    >

      <a-gltf-model
        id="closedChest"
        src="#closedChestModel"
        position="0 0 0.15"
        rotation="0 0 0"
        scale="1 1 1">
      </a-gltf-model>


      <a-gltf-model
        id="openChest"
        src="#openChestModel"
        position="0 0 0.15"
        rotation="0 0 0"
        scale="1 1 1"
        visible="false">
      </a-gltf-model>


      <a-sphere
        id="reward"
        position="0 0.75 0.15"
        radius="0.14"
        color="#FFD700"
        visible="false">
      </a-sphere>

    </a-entity>

  </a-scene>


  <script>

    const STAMP_KEY = "stamp_hmd";

    const ALL_STAMPS = [
      "stamp_hmd",
      "stamp_cave",
      "stamp_touch",
      "stamp_other"
    ];


    const imageTarget =
      document.querySelector("#imageTarget");

    const closedChest =
      document.querySelector("#closedChest");

    const openChest =
      document.querySelector("#openChest");

    const reward =
      document.querySelector("#reward");

    const holdButton =
      document.querySelector("#holdButton");

    const progress =
      document.querySelector("#progress");

    const status =
      document.querySelector("#status");

    const stampCount =
      document.querySelector("#stampCount");

    const stampMessage =
      document.querySelector("#stampMessage");


    const HOLD_TIME = 1000;


    let holdTimer = null;

    let targetVisible = false;

    let opened =
      localStorage.getItem(STAMP_KEY) === "true";


    function getStampCount() {

      let count = 0;

      ALL_STAMPS.forEach(function(key) {

        if (localStorage.getItem(key) === "true") {

          count++;

        }

      });

      return count;

    }


    function updateStampCount() {

      const count = getStampCount();

      stampCount.textContent =
        "STAMPS: " +
        count +
        " / " +
        ALL_STAMPS.length;

    }


    function showCollectedState() {

      closedChest.setAttribute(
        "visible",
        false
      );

      openChest.setAttribute(
        "visible",
        true
      );

      reward.setAttribute(
        "visible",
        true
      );

      holdButton.style.display =
        "none";

    }


    function startHold(event) {

      if (opened || !targetVisible) {
        return;
      }

      event.preventDefault();

      clearTimeout(holdTimer);

      status.textContent =
        "Keep holding...";

      progress.style.transition =
        "width 1s linear";

      progress.style.width =
        "100%";

      holdTimer =
        setTimeout(
          openChestAction,
          HOLD_TIME
        );

    }


    function cancelHold() {

      if (opened) {
        return;
      }

      clearTimeout(holdTimer);

      holdTimer = null;

      progress.style.transition =
        "none";

      progress.style.width =
        "0%";

      if (targetVisible) {

        status.textContent =
          "Hold the button for 1 second";

      }

    }


    function openChestAction() {

      opened = true;

      holdTimer = null;

      localStorage.setItem(
        STAMP_KEY,
        "true"
      );

      showCollectedState();

      progress.style.transition =
        "none";

      progress.style.width =
        "0%";

      status.textContent =
        "Stamp collected!";

      stampMessage.style.display =
        "block";

      updateStampCount();


      setTimeout(
        function() {

          stampMessage.style.display =
            "none";

        },
        2000
      );

    }


    imageTarget.addEventListener(
      "targetFound",
      function() {

        targetVisible = true;

        if (opened) {

          showCollectedState();

          status.textContent =
            "Stamp already collected";

        } else {

          holdButton.style.display =
            "block";

          status.textContent =
            "Hold the button for 1 second";

        }

      }
    );


    imageTarget.addEventListener(
      "targetLost",
      function() {

        targetVisible = false;

        cancelHold();

        if (!opened) {

          holdButton.style.display =
            "none";

          status.textContent =
            "Point the camera at the target";

        }

      }
    );


    holdButton.addEventListener(
      "pointerdown",
      startHold
    );


    holdButton.addEventListener(
      "pointerup",
      cancelHold
    );


    holdButton.addEventListener(
      "pointercancel",
      cancelHold
    );


    holdButton.addEventListener(
      "pointerleave",
      cancelHold
    );


    holdButton.addEventListener(
      "contextmenu",
      function(event) {

        event.preventDefault();

      }
    );


    if (opened) {

      showCollectedState();

    }


    updateStampCount();

  </script>

</body>
</html>
