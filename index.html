<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    a-scene {
      position: fixed !important;
      top: 0;
      left: 0;
      width: 100vw !important;
      height: 100vh !important;
    }

    #message {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 18px;
      z-index: 9999;
      display: none;
    }
  </style>
</head>

<body>

<div id="message">获得成功！</div>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind;"
  embedded
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-camera
    position="0 0 0"
    look-controls="enabled: false"
    cursor="rayOrigin: mouse; fuse: false"
    raycaster="objects: .clickable">
  </a-camera>

  <a-entity mindar-image-target="targetIndex: 0">

    <a-box
      id="targetObject"
      class="clickable"
      position="0 0 0.3"
      width="0.7"
      height="0.7"
      depth="0.7"
      color="#8B4513">
    </a-box>

  </a-entity>

</a-scene>

<script>

const object = document.querySelector("#targetObject");
const message = document.querySelector("#message");

let holdTimer = null;
let disappeared = false;

function startHold() {

  if (disappeared) return;

  console.log("开始长按");

  object.setAttribute("color", "#FFD700");

  holdTimer = setTimeout(() => {

    disappeared = true;

    object.setAttribute("visible", false);

    message.style.display = "block";

    setTimeout(() => {
      message.style.display = "none";
    }, 2000);

  }, 1000);
}


function cancelHold() {

  if (holdTimer) {
    clearTimeout(holdTimer);
    holdTimer = null;
  }

  if (!disappeared) {
    object.setAttribute("color", "#8B4513");
  }
}


object.addEventListener("mousedown", startHold);

object.addEventListener("mouseup", cancelHold);

object.addEventListener("mouseleave", cancelHold);

</script>

</body>
</html>
