
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
                 maximum-scale=1.0, user-scalable=no">

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    a-scene {
      position: fixed !important;
      inset: 0;
      width: 100vw !important;
      height: 100vh !important;
    }

    #ui {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 40px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }

    #stampCount, #status, #debugInfo {
      padding: 10px 16px;
      margin-bottom: 10px;
      border-radius: 10px;
      text-align: center;
    }

    #stampCount {
      background: rgba(255,255,255,0.9);
      color: #222;
      font-weight: bold;
    }

    #status {
      background: rgba(0,0,0,0.75);
      color: white;
    }

    #debugInfo {
      font-size: 12px;
      background: rgba(0,0,0,0.65);
      color: white;
    }

    #holdButton {
      position: relative;
      width: 220px;
      height: 58px;
      border: none;
      border-radius: 14px;
      background: #222;
      color: white;
      font-size: 16px;
      font-weight: bold;
      overflow: hidden;
      display: none;
      pointer-events: auto;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #progress {
      position: absolute;
      inset: 0;
      width: 0%;
      background: rgba(255,255,255,0.3);
      pointer-events: none;
    }

    #buttonText {
      position: relative;
      z-index: 1;
    }

    #stampMessage {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%,-50%);
      z-index: 10000;
      padding: 20px 30px;
      background: rgba(0,0,0,0.85);
      color: white;
      font-size: 28px;
      font-weight: bold;
      border-radius: 16px;
      display: none;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="ui">
    <div id="stampCount">STAMPS: 0 / 4</div>
    <div id="status">Point the camera at the target</div>
    <div id="debugInfo">Initializing AR...</div>

    <button id="holdButton" type="button">
      <div id="progress"></div>
      <span id="buttonText">HOLD TO OPEN</span>
    </button>
  </div>

  <div id="stampMessage">STAMP GET!</div>

  <a-scene
    id="scene"
    mindar-image="
      imageTargetSrc: ./hmdvr.mind;
      autoStart: true;
      filterMinCF: 0.0005;
      filterBeta: 300;
      warmupTolerance: 10;
      missTolerance: 10;
    "
    embedded
    color-space="sRGB"
    renderer="colorManagement: true; antialias: false;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets timeout="15000">
      <a-asset-item
        id="closedChestModel"
        src="https://cdn.3dassets.dev/assets/19941/v1/model.glb"
        crossorigin="anonymous">
      </a-asset-item>

      <a-asset-item
        id="openChestModel"
        src="https://cdn.3dassets.dev/assets/19950/v1/model.glb"
        crossorigin="anonymous">
      </a-asset-item>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity
      id="imageTarget"
      mindar-image-target="targetIndex: 0">

      <a-gltf-model
        id="closedChest"
        src="#closedChestModel"
        position="0 0 0.15"
        scale="1 1 1">
      </a-gltf-model>

      <a-gltf-model
        id="openChest"
        src="#openChestModel"
        position="0 0 0.15"
        scale="1 1 1"
        visible="false">
      </a-gltf-model>

      <a-entity
        id="reward"
        position="0 0.75 0.15"
        visible="false">

        <a-sphere
          id="rewardFallback"
          radius="0.14"
          color="#FFD700">
        </a-sphere>

        <a-entity
          id="hmdObject"
          rotation="0 0 0"
          scale="0.5 0.5 0.5"
          visible="false">
        </a-entity>

      </a-entity>

    </a-entity>
  </a-scene>

  <script>
    const STAMP_KEY = "stamp_hmd";

    const ALL_STAMPS = [
      "stamp_hmd",
      "stamp_cave",
      "stamp_touch",
      "stamp_other"
    ];

    const scene = document.querySelector("#scene");
    const imageTarget = document.querySelector("#imageTarget");

    const closedChest = document.querySelector("#closedChest");
    const openChest = document.querySelector("#openChest");
    const reward = document.querySelector("#reward");
    const rewardFallback = document.querySelector("#rewardFallback");
    const hmdObject = document.querySelector("#hmdObject");

    const holdButton = document.querySelector("#holdButton");
    const progress = document.querySelector("#progress");
    const status = document.querySelector("#status");
    const debugInfo = document.querySelector("#debugInfo");
    const stampCount = document.querySelector("#stampCount");
    const stampMessage = document.querySelector("#stampMessage");

    const HOLD_TIME = 1000;

    let holdTimer = null;
    let targetVisible = false;
    let hmdLoadStarted = false;

    let opened =
      localStorage.getItem(STAMP_KEY) === "true";

    function setDebug(message) {
      debugInfo.textContent = message;
      console.log(message);
    }

    function getStampCount() {
      return ALL_STAMPS.filter(
        key => localStorage.getItem(key) === "true"
      ).length;
    }

    function updateStampCount() {
      stampCount.textContent =
        "STAMPS: " + getStampCount() +
        " / " + ALL_STAMPS.length;
    }

    function loadHmdModel() {
      if (hmdLoadStarted) return;

      hmdLoadStarted = true;
      setDebug("Loading HMD model...");

      hmdObject.setAttribute(
        "gltf-model",
        "url(./hmdvr.glb)"
      );
    }

    hmdObject.addEventListener("model-loaded", function() {
      hmdObject.setAttribute("visible", true);
      rewardFallback.setAttribute("visible", false);

      setDebug("HMD model loaded successfully");
    });

    hmdObject.addEventListener("model-error", function(event) {
      console.error("HMD model error:", event.detail);
      setDebug("HMD model failed to load");
    });

    closedChest.addEventListener("model-error", function() {
      setDebug("Closed chest model failed to load");
    });

    openChest.addEventListener("model-error", function() {
      setDebug("Open chest model failed to load");
    });

    scene.addEventListener("loaded", function() {
      setDebug("AR scene initialized");
    });

    function showCollectedState() {
      closedChest.setAttribute("visible", false);
      openChest.setAttribute("visible", true);
      reward.setAttribute("visible", true);

      holdButton.style.display = "none";

      loadHmdModel();
    }

    function startHold(event) {
      if (opened || !targetVisible) return;

      event.preventDefault();
      clearTimeout(holdTimer);

      status.textContent = "Keep holding...";

      progress.style.transition = "width 1s linear";
      progress.style.width = "100%";

      holdTimer = setTimeout(
        openChestAction,
        HOLD_TIME
      );
    }

    function cancelHold() {
      if (opened) return;

      clearTimeout(holdTimer);
      holdTimer = null;

      progress.style.transition = "none";
      progress.style.width = "0%";

      if (targetVisible) {
        status.textContent =
          "Hold the button for 1 second";
      }
    }

    function openChestAction() {
      if (opened || !targetVisible) return;

      opened = true;
      holdTimer = null;

      localStorage.setItem(STAMP_KEY, "true");

      showCollectedState();
      updateStampCount();

      status.textContent = "Stamp collected!";
      stampMessage.style.display = "block";

      setTimeout(function() {
        stampMessage.style.display = "none";
      }, 2000);
    }

    imageTarget.addEventListener("targetFound", function() {
      targetVisible = true;
      setDebug("Marker detected");

      if (opened) {
        showCollectedState();
        status.textContent = "Stamp already collected";
      } else {
        holdButton.style.display = "block";
        status.textContent =
          "Hold the button for 1 second";
      }
    });

    imageTarget.addEventListener("targetLost", function() {
      targetVisible = false;
      cancelHold();

      if (!opened) {
        holdButton.style.display = "none";
        status.textContent =
          "Point the camera at the target";
      }
    });

    holdButton.addEventListener("pointerdown", startHold);
    holdButton.addEventListener("pointerup", cancelHold);
    holdButton.addEventListener("pointercancel", cancelHold);
    holdButton.addEventListener("pointerleave", cancelHold);

    holdButton.addEventListener("contextmenu", function(event) {
      event.preventDefault();
    });

    updateStampCount();

    if (opened) {
      showCollectedState();
    }
  </script>
</body>
</html>
